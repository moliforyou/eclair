version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: chess-redis
    ports:
      - "6379:6379"
