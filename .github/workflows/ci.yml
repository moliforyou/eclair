name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      # BOOTSTRAP (temporary)
      - name: Check formatting
        continue-on-error: true
        run: ./eclair format && git diff --exit-code -- src tests tools

      - name: Check layer rules
        run: ./eclair layers

      - name: Build
        id: build
        run: ./eclair build

      - name: Analyze
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./eclair analyze

      # Infra.Tests uses Testcontainers; Docker is preinstalled on ubuntu runners
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./eclair test

      # BOOTSTRAP (temporary)
      - name: Print bootstrap files
        if: ${{ always() }}
        run: |
          echo "=== PATCH"; git diff -- src tests tools; echo "=== END PATCH"
          for f in $(git ls-files --others --exclude-standard | grep packages.lock.json); do echo "=== FILE $f"; cat "$f"; echo "=== END FILE"; done
