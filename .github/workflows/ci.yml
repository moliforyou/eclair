name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: ./eclair format && git diff --exit-code -- src tests tools

      - name: Check layer rules
        run: ./eclair layers

      - name: Build
        run: ./eclair build

      # Infra.Tests uses Testcontainers; Docker is preinstalled on ubuntu runners
      - name: Test
        run: ./eclair test

