name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas src tests && git diff --exit-code -- src tests

      - name: Check layer rules
        run: scripts/check-layers.sh

      - name: Build
        run: dotnet build ChessPlatform.slnx

      # Infra.Tests uses Testcontainers; Docker is preinstalled on ubuntu runners
      - name: Test
        run: dotnet test ChessPlatform.slnx --no-build

