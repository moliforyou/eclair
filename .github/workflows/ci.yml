name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      # BOOTSTRAP (temporary): keep going past formatting so the build can write lock files.
      - name: Check formatting
        continue-on-error: true
        run: ./eclair format && git diff --exit-code -- src tests tools

      - name: Check layer rules
        run: ./eclair layers

      # BOOTSTRAP (temporary): list every warning in every project in one run.
      - name: List all warnings
        continue-on-error: true
        run: dotnet build ChessPlatform.slnx -p:TreatWarningsAsErrors=false 2>&1 | grep -E "warning (FS|NU)[0-9]+" | sed -E 's# \[[^]]*\]$##' | sort -u

      - name: Build
        id: build
        run: ./eclair build

      - name: Analyze
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./eclair analyze

      # Infra.Tests uses Testcontainers; Docker is preinstalled on ubuntu runners
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./eclair test

      # BOOTSTRAP (temporary): print the generated lock files and Fantomas output into the log.
      - name: Print bootstrap files
        if: ${{ always() }}
        run: |
          echo "=== PATCH"; git diff -- src tests tools; echo "=== END PATCH"
          for f in $(git ls-files --others --exclude-standard | grep packages.lock.json); do echo "=== FILE $f"; cat "$f"; echo "=== END FILE"; done
