name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      # BOOTSTRAP (temporary): keep going past formatting so the build can write lock files.
      # DEBUG (temporary)
      - name: Inspect eclair build
        run: |
          dotnet build tools/eclair/Eclair.fsproj -o /tmp/eclair-out -v n 2>&1 | grep -iE "fsharp.core|warn|error|CentralPackage|lock" | head -60 || true
          ls /tmp/eclair-out | head -40
          echo "=== lock"; cat tools/eclair/packages.lock.json || true
          echo "=== assets FSharp.Core"; grep -n -A12 '"FSharp.Core/' tools/eclair/obj/project.assets.json | head -60 || true

      - name: Check formatting
        continue-on-error: true
        run: ./eclair format && git diff --exit-code -- src tests tools

      - name: Check layer rules
        run: ./eclair layers

      - name: Build
        id: build
        run: ./eclair build

      - name: Analyze
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./eclair analyze

      # Infra.Tests uses Testcontainers; Docker is preinstalled on ubuntu runners
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./eclair test

      # BOOTSTRAP (temporary): print the generated lock files and Fantomas output into the log.
      - name: Print bootstrap files
        if: ${{ always() }}
        run: |
          echo "=== PATCH"; git diff -- src tests tools; echo "=== END PATCH"
          for f in $(git ls-files --others --exclude-standard | grep packages.lock.json); do echo "=== FILE $f"; cat "$f"; echo "=== END FILE"; done
